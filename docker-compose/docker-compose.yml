# Wazuh single-node — adapted for Synology DS224+ (/volume1/docker/wazuh/)
# Base: wazuh/wazuh-docker v4.14.7 official single-node/docker-compose.yml
#
# Adaptations from the official file (see wazuh-homelab/docker-compose/README.md
# for full reasoning):
#   - pull_policy: never on every pre-built image — matches the telemetry stack
#     convention. Container Manager's Build function fails without an already-cached
#     image; always bring this stack up via CLI:
#       cd /volume1/docker/wazuh && sudo docker compose up -d
#   - mem_limit set explicitly on each service — shared 6GB-hard-ceiling NAS,
#     Plex and telemetry take priority. TIGHT budget, see note below.
#   - wazuh_logs bind-mounted to host (./wazuh-manager/logs) so plain-text logs
#     (ossec.log, alerts.log) are readable without `docker exec`. Every other
#     persistent volume (indexer segment data, manager etc/queue/config, filebeat
#     state) stays a NAMED volume — Lucene/internal-format data, not human-readable,
#     and permission-sensitive in the same way Loki's uid=10001 requirement was.
#     Docker manages ownership internally for named volumes; no chown/chmod dance.
#
# CREDENTIALS: read from .env (gitignored) via ${VAR} substitution below.
# See .env.example for the three variables required, and README.md's
# "Credential rotation" section for how each was actually rotated —
# WAZUH_INDEXER_PASSWORD and WAZUH_DASHBOARD_PASSWORD require regenerating
# a bcrypt hash in config/wazuh_indexer/internal_users.yml and pushing it
# via securityadmin.sh; setting the value here alone is NOT sufficient for
# those two. WAZUH_API_PASSWORD also requires a matching update in
# config/wazuh_dashboard/wazuh.yml (not compose-templated, edited directly —
# see wazuh.yml.example).
#
# STILL OPEN:
#   1. mem_limit budget below totals 3.5GB. Telemetry's live snapshot (not the
#      6-month average) was ~1GB. That's ~4.5GB of 6GB before DSM/kernel overhead —
#      workable but genuinely tight. Watch memory closely, especially during
#      Plex transcoding.

services:
  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.7
    pull_policy: never
    hostname: wazuh.manager
    container_name: wazuh.manager
    restart: always
    mem_limit: 1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      - "1514:1514"
      - "1515:1515"
      - "55000:55000"
    # 514:514/udp intentionally omitted — the telemetry stack's Alloy container
    # already owns host port 514 for OPNsense syslog. OPNsense integration here
    # goes through the os-wazuh-agent plugin (1514/1515 above), not raw syslog,
    # so Wazuh never needs to bind 514 at all.
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD}   # must match wazuh.indexer + wazuh.dashboard below
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD}            # must match wazuh.dashboard below AND config/wazuh_dashboard/wazuh.yml
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - ./wazuh-manager/logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ./config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.7
    pull_policy: never
    hostname: wazuh.indexer
    container_name: wazuh.indexer
    restart: always
    mem_limit: 2g
    ports:
      - "9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem
      - ./config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem
      - ./config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem
      - ./config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.14.7
    pull_policy: never
    hostname: wazuh.dashboard
    container_name: wazuh.dashboard
    restart: always
    mem_limit: 512m
    ports:
      - "8443:5601"
    # Host port 443 is already claimed by DSM's native nginx (Login Portal /
    # reverse proxy layer) — confirmed via `netstat -tulnp | grep :443` showing
    # a root-owned nginx: master process, not a Docker container. Dashboard is
    # reachable at https://<nas-ip>:8443 instead.
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD}   # must match wazuh.indexer + wazuh.manager above
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=${WAZUH_DASHBOARD_PASSWORD} # kibanaserver's password
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD}            # must match wazuh.manager above AND config/wazuh_dashboard/wazuh.yml
    volumes:
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      - wazuh.indexer
    links:
      - wazuh.indexer:wazuh.indexer
      - wazuh.manager:wazuh.manager

volumes:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
